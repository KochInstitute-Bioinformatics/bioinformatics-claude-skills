# Example: Koch Institute BCC cluster (the environment these skills were developed on).
QUEUE=bcc
QUEUE_ON_CLI=yes
CONDA_SETUP=module add miniconda3/v4; source /home/software/conda/miniconda3/bin/condainit
SINGULARITY_LOAD=module load singularity/3.5.0
RNASEQ_TOOLS_LOAD=module add star/2.7.9a; module add salmon/1.10.0
SIF_DIR=/net/bmc-lab3/data/bcc/shared/singularity_images
BULK_IMAGE=docker://yannvrb56/bulkrnaseq:latest
SC_IMAGE=docker://yannvrb56/r4_6_0_python3_singlecell_visium:latest
AZIMUTH_REFS_DIR=/net/bmc-lab3/data/bcc/shared/azimuth_refs
WEB_URL_PREFIX=
SINGULARITY_BIND=/net/bmc-lab3
MODULE_INIT=/opt/ohpc/admin/lmod/lmod/init/bash
MODULEPATH=/opt/ohpc/pub/modulefiles:/home/software/modulefiles
