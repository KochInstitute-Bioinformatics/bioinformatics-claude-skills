# Example: MIT ORCD Engaging (SLURM). Public partition limits: https://orcd-docs.mit.edu/running-jobs/available-resources
# (mit_normal: 12 h and 96 cores per job at most; mit_preemptable: 48 h, jobs can be stopped by higher-priority work).
SCHEDULER=slurm
QUEUE=mit_normal
QUEUE_ON_CLI=no
MAX_TIME=12:00:00
MAX_CPUS=96
# The Apptainer/Singularity module name is not confirmed from public documentation. On a login node run
#   module avail apptainer
# and put the load line here, for example: module load apptainer/<version>
SINGULARITY_LOAD=
